[project]
name = "scan2print"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fast-simplification>=0.2.0",
    "manifold3d>=3.5.2",
    "mapbox-earcut>=2.0.0",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "opencv-contrib-python>=5.0.0.93",
    "pillow>=12.3.0",
    "rich>=15.0.0",
    "rtree>=1.4.1",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "trimesh>=5.0.0",
]

[project.scripts]
scan2print = "scan2print.cli:main"

# Makes `uv sync` install the console script above. Without it uv treats this
# as a bare workspace and skips entry points entirely.
[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scan2print"]
